<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 532 629" role="img" aria-label="체커보드 위의 체스 킹">
  <defs>
    <!-- 킹 — 원본(칸 XOR 킹)에 칸을 한 번 더 XOR 해서 되찾은 모양. 원본과 완전히 같다. -->
    <path id="hip-king" fill-rule="evenodd" d="M0 0H175V166H0ZM353 0H528V166H353ZM175 166H353V334H175ZM0 334H175V500H0ZM353 334H530V502H353ZM359.714 254.184L356.721 269.18H388.868L375.58 334H353V502H376.726L377.457 516.51H405.192V545.771H420.898V626.999H242V545.771H257.543V516.51H285.442L288.717 451.54H272.23V418.189H290.398L292.844 369.667H278.578V339.34H288.413L287.318 334H353V254.184H359.714ZM530 502H376.726L374.183 451.54H387.068V418.189H372.501L370.056 369.667H382.553V339.34H374.485L375.58 334H530V502ZM353 254.184H339.621L340.103 241.688H352.398V227.802H340.638L341.093 216H322.471L322.926 227.802H311.165V241.688H323.461L323.943 254.184H303.85L306.843 269.18H274.03L287.318 334H175V166H353V254.184Z"/>
    <!-- 칸 안쪽만 남기는 오려내기 -->
    <clipPath id="hip-cells">
      <rect x="0" y="0" width="175" height="166"/>
      <rect x="353" y="0" width="175" height="166"/>
      <rect x="175" y="166" width="178" height="168"/>
      <rect x="0" y="334" width="175" height="166"/>
      <rect x="353" y="334" width="177" height="168"/>
    </clipPath>
  </defs>

  <!-- 1. 킹을 검정으로 깔고 -->
  <use href="#hip-king" fill="#111"/>

  <!-- 2. X 자로 놓인 다섯 칸을 흰 바탕 + 테두리로 그 위에 덮는다 -->
  <g fill="#fff" stroke="#111" stroke-width="1">
    <rect x="0" y="0" width="175" height="166"/>
    <rect x="353" y="0" width="175" height="166"/>
    <rect x="175" y="166" width="178" height="168"/>
    <rect x="0" y="334" width="175" height="166"/>
    <rect x="353" y="334" width="177" height="168"/>
  </g>

  <!-- 3. 칸에 가려진 킹은 테두리만 다시 그려 준다 — 칸 안은 흰색, 칸 밖은 검정 (원본의 흑백 분할 유지) -->
  <g clip-path="url(#hip-cells)">
    <use href="#hip-king" fill="none" stroke="#111" stroke-width="1"/>
  </g>
</svg>
